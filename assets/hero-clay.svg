<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="t d">
  <title id="t">Clay illustration of Send &amp; Sign</title>
  <desc id="d">A friendly clay envelope character holding a pencil in front of a signed contract, a phone showing a six-digit code, and a green signed badge, set against soft clay mountains.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="1" stop-color="#ffe9d6"/>
    </linearGradient>
    <radialGradient id="gSun" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffe39a"/><stop offset=".6" stop-color="#e8b94a"/><stop offset="1" stop-color="#c9952a"/>
    </radialGradient>
    <radialGradient id="gLav" cx="35%" cy="20%" r="90%">
      <stop offset="0" stop-color="#ddd1fb"/><stop offset=".55" stop-color="#b8a4ed"/><stop offset="1" stop-color="#8f78d4"/>
    </radialGradient>
    <radialGradient id="gPeach" cx="30%" cy="15%" r="95%">
      <stop offset="0" stop-color="#ffd2b5"/><stop offset=".55" stop-color="#ffb084"/><stop offset="1" stop-color="#ea8a5c"/>
    </radialGradient>
    <radialGradient id="gMint" cx="40%" cy="0%" r="110%">
      <stop offset="0" stop-color="#cdeee3"/><stop offset=".5" stop-color="#a4d4c5"/><stop offset="1" stop-color="#78b3a1"/>
    </radialGradient>
    <radialGradient id="gSnow" cx="35%" cy="25%" r="80%">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#efe7d6"/>
    </radialGradient>
    <radialGradient id="gCoral" cx="32%" cy="22%" r="85%">
      <stop offset="0" stop-color="#ff9f8f"/><stop offset=".5" stop-color="#ff6b5a"/><stop offset="1" stop-color="#dc4636"/>
    </radialGradient>
    <radialGradient id="gPaper" cx="30%" cy="20%" r="95%">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#fbf5e8"/><stop offset="1" stop-color="#e9dfc9"/>
    </radialGradient>
    <radialGradient id="gInk" cx="30%" cy="15%" r="95%">
      <stop offset="0" stop-color="#3b3b3b"/><stop offset=".6" stop-color="#151515"/><stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="gTeal" cx="32%" cy="25%" r="85%">
      <stop offset="0" stop-color="#4f7d7a"/><stop offset=".55" stop-color="#1a3a3a"/><stop offset="1" stop-color="#0c2222"/>
    </radialGradient>
    <radialGradient id="gPink" cx="32%" cy="25%" r="85%">
      <stop offset="0" stop-color="#ff9cc0"/><stop offset=".55" stop-color="#ff4d8b"/><stop offset="1" stop-color="#d92b68"/>
    </radialGradient>
    <linearGradient id="gPencil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset=".5" stop-color="#e8b94a"/><stop offset="1" stop-color="#b98a22"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#6b3b22" flood-opacity=".22"/>
    </filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

  <rect width="560" height="520" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="462" cy="98" r="44" fill="url(#gSun)" filter="url(#drop)"/>
  <ellipse cx="448" cy="82" rx="14" ry="9" fill="#fff" opacity=".45" filter="url(#blur3)"/>

  <!-- floating clay blobs -->
  <circle cx="74" cy="118" r="16" fill="url(#gPink)" filter="url(#drop)"/>
  <circle cx="112" cy="78" r="8" fill="url(#gLav)" filter="url(#drop)"/>

  <!-- back mountains -->
  <path d="M-20 390 C 40 330, 90 175, 170 165 C 232 157, 262 238, 300 262 C 342 205, 392 122, 462 132 C 532 142, 560 232, 600 282 L600 540 L-20 540 Z" fill="url(#gLav)"/>
  <path d="M136 196 C 150 168, 186 160, 204 186 C 192 182, 186 198, 172 190 C 160 202, 150 188, 136 196 Z" fill="url(#gSnow)"/>
  <path d="M428 160 C 442 134, 482 128, 500 156 C 488 151, 480 168, 466 160 C 452 172, 440 158, 428 160 Z" fill="url(#gSnow)"/>

  <!-- mid hill -->
  <path d="M-20 430 C 60 362, 140 334, 232 362 C 302 384, 362 332, 442 332 C 512 332, 562 382, 600 402 L600 540 L-20 540 Z" fill="url(#gPeach)"/>
  <!-- front ground -->
  <path d="M-20 470 C 100 440, 222 450, 300 466 C 402 482, 502 452, 600 456 L600 540 L-20 540 Z" fill="url(#gMint)"/>
  <ellipse cx="120" cy="458" rx="60" ry="6" fill="#fff" opacity=".35" filter="url(#blur3)"/>

  <!-- contract paper -->
  <g transform="rotate(-8 238 268)" filter="url(#drop)">
    <rect x="152" y="152" width="172" height="226" rx="18" fill="url(#gPaper)"/>
    <rect x="174" y="180" width="96" height="10" rx="5" fill="#1a3a3a" opacity=".85"/>
    <rect x="174" y="204" width="128" height="7" rx="3.5" fill="#d9cfb9"/>
    <rect x="174" y="220" width="118" height="7" rx="3.5" fill="#d9cfb9"/>
    <rect x="174" y="236" width="128" height="7" rx="3.5" fill="#d9cfb9"/>
    <rect x="174" y="252" width="90" height="7" rx="3.5" fill="#d9cfb9"/>
    <rect x="174" y="268" width="122" height="7" rx="3.5" fill="#d9cfb9"/>
    <path d="M178 320 C 196 292, 206 330, 222 306 C 232 292, 240 322, 254 304 C 262 296, 270 312, 290 300" fill="none" stroke="#ff4d8b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="174" y="334" width="120" height="3" rx="1.5" fill="#bfb39a"/>
  </g>

  <!-- signed badge -->
  <g filter="url(#drop)">
    <circle cx="330" cy="176" r="36" fill="url(#gTeal)"/>
    <path d="M314 177 L326 189 L348 164" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="318" cy="158" rx="11" ry="6" fill="#fff" opacity=".3" filter="url(#blur3)"/>
  </g>

  <!-- phone -->
  <g filter="url(#drop)">
    <rect x="370" y="214" width="132" height="244" rx="28" fill="url(#gInk)"/>
    <rect x="382" y="228" width="108" height="216" rx="19" fill="#fffaf0"/>
    <rect x="418" y="236" width="36" height="6" rx="3" fill="#ebe6d6"/>
    <rect x="394" y="256" width="62" height="7" rx="3.5" fill="#0a0a0a"/>
    <rect x="394" y="270" width="84" height="5" rx="2.5" fill="#d9cfb9"/>
    <g fill="#fff" stroke="#0a0a0a" stroke-width="1.6">
      <rect x="394" y="288" width="13" height="18" rx="4"/>
      <rect x="409.5" y="288" width="13" height="18" rx="4"/>
      <rect x="425" y="288" width="13" height="18" rx="4"/>
      <rect x="440.5" y="288" width="13" height="18" rx="4"/>
      <rect x="456" y="288" width="13" height="18" rx="4" stroke="#d9cfb9"/>
      <rect x="471.5" y="288" width="13" height="18" rx="4" stroke="#d9cfb9"/>
    </g>
    <g fill="#0a0a0a" font-family="Inter, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      <text x="400.5" y="301">4</text><text x="416" y="301">8</text><text x="431.5" y="301">1</text><text x="447" y="301">9</text>
    </g>
    <rect x="394" y="320" width="84" height="54" rx="10" fill="#f5f0e0"/>
    <path d="M402 356 C 412 336, 418 362, 428 346 C 434 338, 440 356, 448 344 C 454 338, 460 350, 470 342" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
    <rect x="394" y="386" width="84" height="22" rx="8" fill="#0a0a0a"/>
    <rect x="414" y="394" width="44" height="6" rx="3" fill="#fff"/>
    <ellipse cx="392" cy="236" rx="10" ry="16" fill="#fff" opacity=".12" filter="url(#blur3)"/>
  </g>

  <!-- shadow under mascot -->
  <ellipse cx="212" cy="452" rx="104" ry="14" fill="#3b2a1a" opacity=".22" filter="url(#blur6)"/>

  <!-- envelope mascot -->
  <g filter="url(#drop)">
    <!-- left arm -->
    <path d="M118 390 C 96 396, 86 414, 92 428" fill="none" stroke="#dc4636" stroke-width="16" stroke-linecap="round"/>
    <rect x="112" y="304" width="200" height="140" rx="34" fill="url(#gCoral)"/>
    <path d="M128 318 L212 380 L296 318" fill="none" stroke="#c63a2b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
    <ellipse cx="150" cy="322" rx="26" ry="10" fill="#fff" opacity=".35" filter="url(#blur3)"/>
    <!-- feet -->
    <ellipse cx="170" cy="446" rx="22" ry="11" fill="#c63a2b"/>
    <ellipse cx="256" cy="446" rx="22" ry="11" fill="#c63a2b"/>
  </g>
  <!-- face -->
  <g>
    <ellipse cx="182" cy="392" rx="14" ry="16" fill="#fff"/>
    <ellipse cx="242" cy="392" rx="14" ry="16" fill="#fff"/>
    <circle cx="186" cy="395" r="7.5" fill="#0a0a0a"/>
    <circle cx="246" cy="395" r="7.5" fill="#0a0a0a"/>
    <circle cx="189" cy="391" r="2.6" fill="#fff"/>
    <circle cx="249" cy="391" r="2.6" fill="#fff"/>
    <ellipse cx="160" cy="414" rx="10" ry="6" fill="#ff4d8b" opacity=".55"/>
    <ellipse cx="266" cy="414" rx="10" ry="6" fill="#ff4d8b" opacity=".55"/>
    <path d="M200 416 Q 214 430 228 416" fill="none" stroke="#0a0a0a" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- right arm + pencil -->
  <g filter="url(#drop)">
    <g transform="rotate(-38 332 326)">
      <rect x="300" y="316" width="86" height="20" rx="8" fill="url(#gPencil)"/>
      <rect x="300" y="316" width="16" height="20" rx="6" fill="#ff9cc0"/>
      <rect x="314" y="316" width="6" height="20" fill="#c9c2b0"/>
      <path d="M386 316 L404 326 L386 336 Z" fill="#f2d7a6"/>
      <path d="M398 323 L404 326 L398 329 Z" fill="#0a0a0a"/>
    </g>
    <path d="M300 384 C 318 376, 326 360, 324 344" fill="none" stroke="#dc4636" stroke-width="16" stroke-linecap="round"/>
    <circle cx="324" cy="342" r="11" fill="url(#gCoral)"/>
  </g>
</svg>
